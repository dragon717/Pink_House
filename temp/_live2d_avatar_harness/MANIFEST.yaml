schema_version: 1
avatar_id: girl_v1
display_name: 少女小人
render_backends:
  - staticImage
  - transparentVideo
  - live2d
asset_roots:
  static_image: ItemManager/Assets.xcassets/AvatarCharacter/girl_v1/avatar_girl_v1_static.imageset/avatar_girl_v1_static.png
  video: asserts/avatar/girl_v1/video
  live2d: asserts/avatar/girl_v1/live2d
  layer_manifest: asserts/avatar/girl_v1/live2d/rig_manifest.json
  layers: asserts/avatar/girl_v1/live2d/layers
  hairstyle_index: asserts/avatar/girl_v1/live2d/hairstyles/hairstyle_index.json
  hairstyles: asserts/avatar/girl_v1/live2d/hairstyles
  default_outfit_manifest: asserts/avatar/girl_v1/live2d/outfits/default/outfit_manifest.json
  default_outfit_layers: asserts/avatar/girl_v1/live2d/outfits/default/layers
  clothing_split_rules: asserts/avatar/girl_v1/live2d/clothing_sticker_split_rules.json
required_actions:
  - idle
  - greet
  - wave
  - thinking
  - happy
  - shy
  - stickerPresent
  - touchHead
  - touchBody
  - sleep
  - talkLoop
required_expressions:
  - neutral
  - smile
  - surprised
  - sad
  - angry
  - sleepy
image2_outputs:
  - name: avatar_girl_v1_static
    canvas: 1086x1448
    destination: ItemManager/Assets.xcassets/AvatarCharacter/girl_v1/avatar_girl_v1_static.imageset/avatar_girl_v1_static.png
    prompt: >
      Full-body front-facing anime-inspired wardrobe assistant base body, modest inner bodysuit,
      delicate magic sticker journal style, clean line art with soft pastel accents, transparent PNG,
      3:4 canvas, centered full body, neutral A-pose, limbs visible and separable, suitable as a
      Live2D-riggable mannequin-like base in a dress coordination editor.
  - name: avatar_girl_v1_default_outfit
    canvas: 1086x1448
    destination: asserts/avatar/girl_v1/live2d/outfits/default/default_outfit_full.png
    prompt: >
      Full-body front-facing anime-inspired wardrobe assistant girl in pastel magical wardrobe dress,
      matching the base body proportions. The outfit is an embedded avatar outfit package, not a
      normal user sticker list item. Split later into bodice, sleeves, cuffs, skirt, shoes, neck bow,
      and hair accessories for bone-bound Live2D movement.
  - name: avatar_girl_v1_short_bob_hairstyle
    canvas: 1086x1448
    destination: asserts/avatar/girl_v1/live2d/hairstyles/short_bob/source_full.png
    prompt: >
      Full-body front-facing anime-inspired wardrobe assistant base avatar matching the base body
      proportions and unitard. Alternate short bob hairstyle in pastel lavender-pink, with clearly
      separable back hair mass, front bangs, side locks, loose strand details, and highlight strands.
      Chroma-key background for transparent hair package extraction.
  - name: avatar_girl_v1_layered_psd_spec
    canvas: 2048x2732
    destination: temp/_live2d_avatar_harness/generated/avatar_girl_v1_layered_psd_spec.psd
    prompt: >
      Layered Live2D-ready PSD concept for a front-facing girl character. Separate head, neck, torso,
      upper arms, forearms, hands, thighs, lower legs, feet, front hair, back hair, side hair, face base, eye whites,
      pupils, highlights, eyelids, eyebrows, mouth shapes A I U E O, blush, skirt hem, and accessories.
      Include hidden joint overdraw at shoulders, elbows, wrists, hips, knees, neck, hair roots, and skirt.
layer_outputs:
  - body_torso_base
  - head_face
  - arm_upper_left
  - arm_upper_right
  - arm_lower_left
  - arm_lower_right
  - hand_left
  - hand_right
  - hip_base
  - thigh_left
  - thigh_right
  - lower_leg_left
  - lower_leg_right
  - foot_left
  - foot_right
hairstyle_layer_outputs:
  - hair_back_base
  - hair_back_detail
  - hair_side_left_base
  - hair_side_right_base
  - hair_side_left_detail
  - hair_side_right_detail
  - hair_front_bangs
  - hair_front_detail
  - hair_highlight_front
  - hair_highlight_back
default_outfit_layer_outputs:
  - dress_bodice
  - dress_skirt
  - sleeve_left
  - sleeve_right
  - wrist_cuff_left
  - wrist_cuff_right
  - hair_bows
  - neck_bow
  - shoe_left
  - shoe_right
negative_prompt: >
  text, letters, watermark, logo, photorealistic, realistic 3D, harsh shadow, dirty background,
  cropped limbs, fused fingers, missing joints, opaque background
acceptance:
  static_image:
    ratio: 0.75
    ratio_tolerance: 0.03
    min_nontransparent_percent: 2.0
    min_file_bytes: 8192
  magic_sticker_v1:
    edge_review_status: bootstrap_pass_with_visual_review_required
    motion_anchor_version: motion_profile_v1
    canvas_scale: 0.72
    target_fps_idle: 24
    target_fps_gesture: 30
    static_contexts:
      - snapshot
      - thumbnail
      - low_power
      - background
  video:
    extension: mov
  live2d_required_files:
    - model3.json
    - moc3
