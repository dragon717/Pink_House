feature_id: product_framework_experience
display_name: 产品框架体验
artifact_root: temp/产品框架体验/_artifacts

delivery:
  require_git_commit: true
  require_real_flow_screenshots: true
  simulator_destination: "platform=iOS Simulator,name=iPhone 16 Pro"
  source_of_truth: "/Users/muniao/Library/Mobile Documents/com~apple~CloudDocs/游戏/github/Pink_House"

phases:
  - id: p0_feature_registry
    name: 功能入口注册表
    priority: P0
    goal: 所有核心功能有统一 id、标题、图标、路由、可展示容器与解锁状态。
    done_when:
      - AppFeatureRegistry 能映射衣橱、心愿尾款、House、手帐、萌宠、来财、日历、世界书、拼豆、裙子股市、回收站、萌宠对话。
      - TabNavigationManager 能按 feature id 导航。
      - 旧 SmallWorldDestination 与现有长按菜单不破坏。

  - id: p1_custom_bottom_dock
    name: 自定义底部导航
    priority: P1
    goal: 底部最右侧入口可由用户替换，降低对 House 长按菜单的依赖。
    done_when:
      - 默认最右侧仍是萌宠对话。
      - 用户可在“我 → 常用入口”里改为心愿尾款、来财、穿搭手帐、魔法贴纸、裙子股市等已解锁功能。
      - 点击底部自定义入口可直达目标功能。

  - id: p2_isometric_journal_room
    name: 等轴手帐房间 MVP
    priority: P2
    goal: House 菜单升级为打开的手帐房间，贴纸/挂画作为功能热区。
    done_when:
      - 固定等轴布局可进入主要 House 功能。
      - 1-3 个裙装/手帐快捷入口包装为海报或挂画。
      - 主题皮肤能影响墙纸、边框或贴纸氛围。

  - id: p3_pet_phone_mvp
    name: 萌宠手机 MVP
    priority: P3
    goal: 用萌宠手持手机承载复杂入口，先做原生 UI 容器。
    done_when:
      - 萌宠手机入口可进入手机壳界面。
      - 手机内有聊天、信箱、主题、来财、股市、手帐等原生入口。
      - HTML/音乐外链只作为安全占位，不开放完整平台能力。

  - id: p4_dress_stock_link_intel
    name: 裙子股市外链情报站
    priority: P4
    goal: 先支持手动链接观察列表，不做全网爬虫。
    done_when:
      - 用户可保存来源链接、标题、价格、图片、备注。
      - 入口可从 House、萌宠手机、底部自定义导航到达。
      - 宠物可读取观察列表给出提醒文案。

art_assets:
  image2_allowed: true
  current_required_assets: []
  backlog:
    - id: isometric_open_journal_room_background
      phase: p2_isometric_journal_room
      type: transparent_png_or_background
      prompt_hint: 打开的少女手帐等轴房间，封面和背面竖起成墙体，书脊为支柱，页面为地板，适合 SwiftUI 热区叠加。
    - id: pet_phone_shell
      phase: p3_pet_phone_mvp
      type: transparent_png
      prompt_hint: 萌宠手持的小手机 UI 外壳，柔粉玻璃质感，屏幕区域留空用于原生 SwiftUI 入口网格。

acceptance:
  screenshot_flows:
    - id: bottom_dock_default
      name: 默认底部入口为萌宠对话
    - id: bottom_dock_change_to_deposit
      name: 在常用入口设置里把底部入口改为心愿尾款
    - id: bottom_dock_deposit_launch
      name: 点击底部入口进入心愿尾款
    - id: favorite_menu_still_works
      name: House 长按常用菜单仍可使用
